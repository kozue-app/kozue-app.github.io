<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kozue</title>
<meta name="description" content="Kozue brings the websites, blogs, podcasts and channels you follow into one place. It works without a server, on your PC alone, or with Miniflux, Feedbin, Inoreader and other services.">
<link rel="alternate" hreflang="es" href="https://kozue.app/es/">
<link rel="alternate" hreflang="en" href="https://kozue.app/en/">
<link rel="alternate" hreflang="de" href="https://kozue.app/de/">
<link rel="alternate" hreflang="fr" href="https://kozue.app/fr/">
<link rel="alternate" hreflang="it" href="https://kozue.app/it/">
<link rel="alternate" hreflang="pt" href="https://kozue.app/pt/">
<link rel="alternate" hreflang="ar" href="https://kozue.app/ar/">
<link rel="alternate" hreflang="zh-Hant" href="https://kozue.app/zh-Hant/">
<link rel="alternate" hreflang="zh-Hans" href="https://kozue.app/zh-Hans/">
<link rel="alternate" hreflang="ja" href="https://kozue.app/ja/">
<link rel="alternate" hreflang="ko" href="https://kozue.app/ko/">
<link rel="alternate" hreflang="ru" href="https://kozue.app/ru/">
<link rel="alternate" hreflang="hi" href="https://kozue.app/hi/">
<link rel="alternate" hreflang="x-default" href="https://kozue.app/">
<link rel="icon" href="/favicon.ico" sizes="any">
<script>
  (function () {
    var L = ["es","en","de","fr","it","pt","ar","zh-Hant","zh-Hans","ja","ko","ru","hi"];
    function pick(list) {
      for (var i = 0; i < list.length; i++) {
        var t = String(list[i] || '').toLowerCase();
        if (t.indexOf('zh') === 0) return /hant|tw|hk|mo/.test(t) ? 'zh-Hant' : 'zh-Hans';
        var p = t.split('-')[0];
        if (L.indexOf(p) >= 0) return p;
      }
      return 'en';
    }
    var saved = null;
    try { saved = localStorage.getItem('kozue-web-lang'); } catch (e) {}
    var l = L.indexOf(saved) >= 0 ? saved : pick(navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language]);
    location.replace('/' + l + '/' + location.hash);
  })();
</script>
</head>
<body>
<noscript>
  <ul><li><a href="/es/" lang="es">Español</a></li><li><a href="/en/" lang="en">English</a></li><li><a href="/de/" lang="de">Deutsch</a></li><li><a href="/fr/" lang="fr">Français</a></li><li><a href="/it/" lang="it">Italiano</a></li><li><a href="/pt/" lang="pt">Português</a></li><li><a href="/ar/" lang="ar">العربية</a></li><li><a href="/zh-Hant/" lang="zh-Hant">繁體中文</a></li><li><a href="/zh-Hans/" lang="zh-Hans">简体中文</a></li><li><a href="/ja/" lang="ja">日本語</a></li><li><a href="/ko/" lang="ko">한국어</a></li><li><a href="/ru/" lang="ru">Русский</a></li><li><a href="/hi/" lang="hi">हिन्दी</a></li></ul>
</noscript>
</body>
</html>
